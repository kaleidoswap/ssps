name: Specification checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-check.txt
      - run: python tools/check_links.py
      - run: python tools/gen_vectors.py --check
      - run: python tools/check_vectors.py
